apply plugin: 'com.android.application'

// Release signing — a Play Store upload needs a *signed* AAB, unlike the debug APKs this repo
// built until now. Never hardcoded: either a local, gitignored keystore.properties (for signing
// a release build on your own machine) or RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/
// RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD env vars (what CI uses, from repo secrets — see
// .github/workflows/build-apk.yml). Neither present: the release build type below just falls
// back to signing with the debug key, same as every build before this, so `assembleDebug`/an
// unconfigured local checkout are never broken by this.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('../keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def releaseStoreFile = System.getenv('RELEASE_STORE_FILE') ?: keystoreProps['storeFile']
def hasReleaseSigning = releaseStoreFile != null

android {
    namespace "fit.forvia.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fit.forvia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // A fixed, checked-in debug keystore instead of Gradle's own implicit default (which
        // auto-generates ~/.android/debug.keystore with random key material the first time it's
        // needed on a machine). CI runners are fresh VMs with no such file lying around, so every
        // build used to get its OWN random debug key — meaning Android refused every "update"
        // over a previous sideload as a signature mismatch, forcing an uninstall (wiping the
        // WebView's session/local storage) to install the new one. Same key every time fixes that.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: keystoreProps['storePassword']
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: keystoreProps['keyAlias']
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
