<!DOCTYPE html>
<!--
  MainActivity's loading overlay, drawn by a small dedicated WebView instead of a native
  AnimatedVectorDrawable — that exact class reliably failed to ever render when added to this
  overlay across several attempts (confirmed on a real device, cause never pinned down without one
  to debug on directly). This is the literal same SVG path data + CSS draw-in animation as Forvia's
  own LogoMark.jsx/index.css (the web app's own logo, already proven working there), just looped
  (the web version draws in once; this repeats for as long as it's on screen) and self-contained
  (no React, no build step — this ships as a plain asset, loaded via file:///android_asset/).
  Keep this file's path data and timing in sync BY HAND with LogoMark.jsx/index.css if either ever
  changes; there's no shared source between them.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: 160px; height: auto; overflow: visible; filter: drop-shadow(0 0 14px rgba(163,230,53,.45)); }
  .lime { fill: #a3e635; stroke: #a3e635; }
  .ink { fill: #ffffff; stroke: #ffffff; }
  .shape {
    fill-opacity: 0; stroke-opacity: 1; stroke-width: 22px; stroke-linejoin: round; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: lm-cycle 2400ms cubic-bezier(.32,.72,0,1) infinite;
    animation-delay: var(--dd, 0ms);
  }
  @keyframes lm-cycle {
    0%   { stroke-dashoffset: 1; fill-opacity: 0; stroke-opacity: 1; }
    40%  { stroke-dashoffset: 0; fill-opacity: 0; stroke-opacity: 1; }
    55%  { fill-opacity: 1; stroke-opacity: 0; }
    85%  { fill-opacity: 1; stroke-opacity: 0; }
    100% { fill-opacity: 0; stroke-opacity: 0; stroke-dashoffset: 1; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 320 313" aria-hidden="true">
  <g transform="translate(0,313) scale(0.1,-0.1)">
    <g class="lime">
      <path class="shape" pathLength="1" style="--dd:0ms" d="M447 1974 c-4 -4 -7 -198 -7 -431 l0 -424 108 3 107 3 0 425 0 425 -101 3 c-55 1 -103 0 -107 -4z"/>
      <path class="shape" pathLength="1" style="--dd:0ms" d="M2520 1550 l0 -430 105 0 105 0 0 430 0 430 -105 0 -105 0 0 -430z"/>
      <path class="shape" pathLength="1" style="--dd:40ms" d="M217 1804 c-4 -4 -7 -124 -7 -266 l0 -258 100 0 100 0 -2 263 -3 262 -90 3 c-50 1 -94 0 -98 -4z"/>
      <path class="shape" pathLength="1" style="--dd:40ms" d="M2770 1545 l0 -265 100 0 100 0 -2 263 -3 262 -97 3 -98 3 0 -266z"/>
      <path class="shape" pathLength="1" style="--dd:80ms" d="M1220 1252 c-96 -92 -238 -226 -315 -299 l-140 -132 215 -1 215 0 310 286 c171 157 317 292 325 300 12 12 -16 14 -210 14 l-225 -1 -175 -167z"/>
    </g>
    <g class="ink">
      <path class="shape" pathLength="1" style="--dd:100ms" d="M1130 2024 l-360 -357 0 -143 0 -144 48 0 47 1 338 334 339 335 416 0 417 0 158 158 c86 86 157 161 157 165 0 4 -270 7 -600 7 l-600 0 -360 -356z"/>
      <path class="shape" pathLength="1" style="--dd:130ms" d="M1377 1672 c-75 -75 -137 -139 -137 -142 0 -3 187 -6 416 -7 l417 -2 66 62 c126 117 221 212 221 219 0 5 -190 8 -423 8 l-422 0 -138 -138z"/>
    </g>
  </g>
</svg>
</body>
</html>
