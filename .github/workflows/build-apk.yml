name: Build APK

# Every push to main builds a fresh version (1.0.<run>), compiles the APK and
# publishes it as a GitHub Release under that tag. Forvia's Settings → Mobile app
# card reads this repo's latest release via the public GitHub API (no token needed,
# this repo is public) to offer the download and flag a new version in the app.
# Same pattern as Nebula-Syst/nebula-mobile-client.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` isn't a recognized value inside `if:` conditions (GitHub rejects the whole
    # workflow file for it, not just the step — this silently broke every build for two days).
    # Stash the presence check in a job-level env var instead; `env` *is* usable in `if:`.
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Compute version (1.0.<run_number>)
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set versionName/versionCode in build.gradle
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle

      - name: npm install
        run: npm install

      - name: cap sync android
        run: npx cap sync android

      - name: Build APK (debug — unsigned, for sideloading/testing, not the Play Store)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/forvia-${{ steps.version.outputs.version }}.apk"

      # Everything below only runs once RELEASE_KEYSTORE_BASE64 (repo secret — the release
      # keystore, base64'd) is actually set; a checkout/fork without it just gets the debug APK
      # above, same as every build before this. Play Store submissions need this signed .aab
      # specifically — it will never accept the debug-signed APK.
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release AAB (Play Store upload)
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Rename AAB
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        run: cp android/app/build/outputs/bundle/release/app-release.aab "dist/forvia-${{ steps.version.outputs.version }}.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          files: dist/forvia-${{ steps.version.outputs.version }}.*
          generate_release_notes: true
